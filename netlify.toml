# Netlify hosts the app so Netlify Identity (Google sign-in) and the
# signed-in-only functions can live on the same origin (#223). The iOS widget
# reads api/events.json from here too (#227).
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Netlify serves the site at the domain root; GitHub Pages previews need a
  # /hpde/pr-preview/pr-<n>/ subpath (set in pr-preview.yml).
  VITE_BASE_PATH = "/"

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

# /api/created-events is routed by the function's own `config.path`.
