# Netlify hosts the app so Netlify Identity (Google sign-in) and the
# signed-in-only functions can live on the same origin (#223). The iOS widget
# reads api/events.json from here too (#227).
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

# /api/events and /api/events.json are routed by their functions' own `config.path`.

# Netlify doesn't know the .webmanifest extension and serves it as
# application/octet-stream. Label it as the web app manifest it is (#375).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Vite names each built asset by its contents, so a changed one is a new
# URL: cache them for good. Netlify's default had the Home Screen app check
# every one with the server each time it opened (#365).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
