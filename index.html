<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover (#318): without it iOS reports every
         env(safe-area-inset-*) as 0, so the tab bar, sheets and page
         bottoms that pad by it sat under the home indicator in the
         Home Screen app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HPDE Events</title>
    <!-- Browser chrome tint: gray-50, the page background. Event pages
         switch it to their white header (src/utils/chromeColor.ts). -->
    <meta name="theme-color" content="#f9fafb" />
    <!-- App icon (#237), rendered from scripts/app-icon/ by
         `npm run icons:generate`. Event pages swap these for the event's
         track icon, matching on rel + sizes (src/utils/trackFavicon.ts). -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Add to Home Screen opens the site full screen, as an app (#375).
         Before iOS 26, Safari only does that for a site that asks: the
         manifest's display, or the older Apple meta tag for when the
         manifest isn't loaded in time. Without them it opened in Safari,
         so the app was installed from a configuration profile instead,
         and the widget's `webapp://` link doesn't find a web clip
         installed that way. The manifest lists no icons: iOS takes the
         Home Screen icon from apple-touch-icon, and Android would use
         manifest icons instead of an event page's track icon (#233). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
