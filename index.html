<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover (#318): without it iOS reports every
         env(safe-area-inset-*) as 0, so the tab bar, sheets and page
         bottoms that pad by it sat under the home indicator in the
         Home Screen app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HPDE Events</title>
    <!-- Browser chrome tint: gray-50, the page background. Event pages
         switch it to their white header (src/utils/chromeColor.ts). -->
    <meta name="theme-color" content="#f9fafb" />
    <!-- App icon (#237), rendered from scripts/app-icon/ by
         `npm run icons:generate`. Event pages swap these for the event's
         track icon, matching on rel + sizes (src/utils/trackFavicon.ts). -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Add to Home Screen opens the site full screen, as an app (#375).
         Before iOS 26, Safari only does that for a site that asks: the
         manifest's display, or the older Apple meta tag for when the
         manifest isn't loaded in time. Without them it opened in Safari,
         and the app had to be installed from a configuration profile.
         The manifest lists no icons: iOS takes the Home Screen icon from
         apple-touch-icon, and Android would use manifest icons instead
         of an event page's track icon (#233). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The loader below, styled here: the app's stylesheet comes with its
         script, after the wait this covers. -->
    <style>
      html, body { margin: 0; background: #f9fafb; }
      .boot-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #111827;
      }
      .boot-loader svg {
        width: 56px;
        opacity: 0;
        animation: boot-pulse 1.4s ease-in-out 0.2s infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.08; }
        50% { opacity: 0.2; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader svg { animation: none; opacity: 0.12; }
      }
    </style>
  </head>
  <body>
    <!-- Until the app's first render replaces it (#365): opened from the
         Home Screen, the screen was blank while the script loaded. The
         checkers of src/assets/checkered-flag.svg — the placeholder for an
         event with no track icon — pulse faintly, as a skeleton does, after
         a moment, so a quick load doesn't flash them. -->
    <div id="root"><div class="boot-loader" role="progressbar" aria-label="Loading"><svg viewBox="0 0 430 373" aria-hidden="true"><g fill="currentColor"><path d="M108 43 208 42 C216 42 220 46 217 53 L192 118 C185 134 172 139 153 140 L65 144 C55 145 52 141 55 135 L87 57 C92 47 99 43 108 43 Z"/><path d="M216 122 316 119 C326 118 328 121 325 130 L302 190 C296 207 283 213 262 214 L167 217 C157 218 155 215 159 207 L185 138 C190 127 200 123 216 122 Z"/><path d="M62 218 150 216 C157 215 159 219 156 225 L128 294 C124 304 114 309 105 309 L22 309 C16 309 14 306 17 298 L45 230 C48 222 53 218 62 218 Z"/><path d="M319 200 412 197 C421 197 425 200 422 210 L391 292 C386 305 377 309 367 309 L268 309 C259 309 256 306 259 299 L290 218 C295 206 304 201 319 200 Z"/></g></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
